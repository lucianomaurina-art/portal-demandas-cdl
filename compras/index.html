<script>
const centers={Serviço:['SPC Brasil','Certificação Digital','Locação de Salas e Espaços','Eventos'],Apoio:['Financeiro','Marketing','Governança','Infraestrutura','TI']};
const categories=['Materiais e suprimentos','Equipamentos e tecnologia','Serviços terceirizados','Eventos e comunicação'];
const states={analysis:'Solicitação registrada',signature:'Aguardando assinatura',quote:'Em cotação',review:'Aguardando aprovação',fix:'Devolvida para ajustes',approved:'Aprovada',ordered:'Compra realizada',done:'Recebida',denied:'Reprovada'};
const seed={vendors:[
{id:1,name:'Sul Suprimentos (demo)',doc:'DEMO-001',contact:'',status:{[categories[0]]:'Validado'}},
{id:2,name:'Ponto Escritório (demo)',doc:'DEMO-002',contact:'',status:{[categories[0]]:'Validado'}},
{id:3,name:'Vale Soluções (demo)',doc:'DEMO-003',contact:'',status:{[categories[2]]:'Pendente'}}],
requests:[{id:1,title:'Reposição de material de escritório',owner:'user',center:'Financeiro',requester:'Colaborador de demonstração',registeredBy:'Colaborador',activity:'Rotina administrativa',purchaseReason:'Repor os kits de escritório para a equipe.',category:categories[0],qty:10,unit:'kit',need:'2026-11-25',reason:'Reposição para uso interno.',status:'review',budgetId:'2026-05-01',estimate:'480',minimum:3,picked:1,choice:'Menor custo total e prazo compatível.',exception:'',quotes:[{vendor:1,price:480,days:3,method:'Boleto',payment:'30 dias',evidence:'Orçamento DEMO-01'},{vendor:2,price:520,days:2,method:'Pix',payment:'À vista',evidence:'Orçamento DEMO-02'},{vendor:3,price:550,days:5,method:'Boleto',payment:'15 dias',evidence:'Orçamento DEMO-03'}],log:['Colaborador · Encaminhou para aprovação.']}]};
const key='cdl-compras-prototipo-v1';
let db;try{db=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch{db=structuredClone(seed)}
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=value=>Number(value).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const portalProfile=parent===window?null:parent.purchasePortalProfile?.(window);
const role=()=>portalProfile?.role??$('role').value;
const ownerKey=()=>portalProfile?.id??role();
const admin=()=>role()==='admin';
const manager=()=>role()==='manager';
const canDeleteVendor=()=>admin()||manager();
const actor=()=>portalProfile?.name||(admin()?'Luciano':manager()?'Gestor':'Colaborador');
const activeVendors=()=>db.vendors.filter(v=>!v.deleted);
const vendor=id=>db.vendors.find(v=>v.id===Number(id));
const validation=(id,category)=>{
 const supplier=vendor(id);
 if(supplier?.deleted)return 'Fornecedor excluído';
 if(category)return supplier?.status[category]||'Sem cadastro na categoria';
 return Object.values(supplier?.status||{}).includes('Validado')?'Validado':'Homologação pendente';
};
const required=r=>r.market?1:3;
const visible=()=>db.requests.filter(r=>!r.inactive&&(admin()||r.owner===ownerKey()));
const nextId=list=>Math.max(0,...list.map(x=>x.id))+1;
let tab='demands',filter='';
const field=(label,html)=>'<label class="field">'+label+html+'</label>';
const options=(items,selected)=>items.map(item=>'<option'+(item===selected?' selected':'')+'>'+esc(item)+'</option>').join('');
function note(message){$('notice').innerHTML='<p class="alert ok">'+esc(message)+'</p>'}
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{note('As alterações estão disponíveis nesta sessão. O navegador bloqueou a gravação local.')}render()}
function open(title,html,wide=false){$('modal').classList.toggle('itemsDialog',wide);$('modalTitle').textContent=title;$('body').innerHTML=html;if(!$('modal').open)$('modal').showModal()}
function close(){$('modal').close()}
$('close').onclick=close;
$('role').onchange=()=>{close();filter='';render();note('Perfil de teste alterado.')};
$('nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}};
$('new').onclick=()=>batchForm();
const batchId=r=>r.batch||r.id;
const protocol=id=>'CP-'+String(id).padStart(4,'0');
const code=r=>protocol(batchId(r))+(r.line?'/'+String(r.line).padStart(2,'0'):'');
const lanes=[['analysis','Solicitação'],['quote','Orçamento'],['review','Análise e aprovação'],['signature','Assinatura da ordem'],['fix','Ajustes solicitados'],['approved','Compra a realizar'],['ordered','Follow-up de entrega'],['done','Concluídas'],['denied','Reprovadas']];
function batches(){
 const map=new Map();
 for(const r of visible()){
  const id=batchId(r);
  if(!map.has(id))map.set(id,[]);
  map.get(id).push(r);
 }
 return [...map.values()];
}
function batchStage(items){
 return ['analysis','fix','quote','review','signature','approved','ordered','done','denied'].find(stage=>items.some(r=>r.status===stage));
}
function batchTitle(items){return items[0].batchTitle||items[0].title}
function batchSummary(items){return items.length+' '+(items.length===1?'item':'itens')+' · Necessidade mais próxima '+dateLabel(items.filter(r=>!['done','denied'].includes(r.status)).map(r=>r.need).sort()[0]||items.map(r=>r.need).sort()[0])}
function boardStage(items){
 const actual=batchStage(items);
 const position=db.boardPositions?.[batchId(items[0])];
 return position?.from===actual&&lanes.some(([stage])=>stage===position.to)?position.to:actual;
}
function renderBoard(){
 const groups=batches();
 $('view').innerHTML=draftList()+'<div class="row spread"><h2>Acompanhamento</h2><label>Coluna <select id="filter"><option value="">Todas</option>'+lanes.map(([k,v])=>'<option value="'+k+'" '+(filter===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label></div><p class="muted">Arraste os cartões entre as colunas. Se a posição for diferente da etapa do fluxo, o cartão mostra a etapa atual.</p><div class="board">'+lanes.filter(([stage])=>!filter||filter===stage).map(([stage,label])=>{
  const cards=groups.filter(items=>boardStage(items)===stage);
  return '<div class="lane" data-lane="'+stage+'"><h3>'+label+' · '+cards.length+'</h3>'+cards.map(items=>'<div class="card" draggable="true" data-drag-batch="'+batchId(items[0])+'"><small>'+protocol(batchId(items[0]))+'</small><h3>'+esc(batchTitle(items))+'</h3><p class="muted">'+esc(batchSummary(items))+'</p>'+
   (stage!==batchStage(items)?'<p><small>Etapa do fluxo · '+esc(states[batchStage(items)])+'</small></p><button data-reset-position="'+batchId(items[0])+'">Voltar à etapa do fluxo</button> ':'')+
   '<button data-batch="'+batchId(items[0])+'">Abrir solicitação</button></div>').join('')+'</div>';
 }).join('')+'</div>';
 wireBoardDrag();
 document.querySelectorAll('[data-reset-position]').forEach(button=>button.onclick=()=>{
  delete db.boardPositions[button.dataset.resetPosition];
  save();
 });
 wireDrafts();
 $('filter').onchange=e=>{filter=e.target.value;render()};
 document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>batchDetails(Number(b.dataset.batch)));
}
function wireBoardDrag(){
 let dragged;
 const board=$('view').querySelector('.board');
 board.ondragstart=e=>{
  const card=e.target.closest('[data-drag-batch]');
  if(!card)return;
  dragged=Number(card.dataset.dragBatch);
  e.dataTransfer.setData('text/plain',String(dragged));
  e.dataTransfer.effectAllowed='move';
 };
 board.ondragend=()=>{
  dragged=undefined;
  board.querySelectorAll('.drop-target').forEach(lane=>lane.classList.remove('drop-target'));
 };
 board.ondragover=e=>{
  const lane=e.target.closest('[data-lane]');
  if(dragged===undefined||!lane)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const bounds=board.getBoundingClientRect();
  if(e.clientX>bounds.right-40)board.scrollLeft+=18;
  else if(e.clientX<bounds.left+40)board.scrollLeft-=18;
  board.querySelectorAll('[data-lane]').forEach(target=>target.classList.toggle('drop-target',target===lane));
 };
 board.ondragleave=e=>{
  const lane=e.target.closest('[data-lane]');
  if(lane&&!lane.contains(e.relatedTarget))lane.classList.remove('drop-target');
 };
 board.ondrop=e=>{
  const lane=e.target.closest('[data-lane]');
  if(dragged===undefined||!lane)return;
  e.preventDefault();
  const id=dragged;
  board.ondragend();
  const items=batches().find(group=>batchId(group[0])===id);
  if(items)moveBoardCard(items,lane.dataset.lane);
 };
}
function moveBoardCard(items,target){
 const source=batchStage(items),id=batchId(items[0]);
 if(boardStage(items)===target)return;
 db.boardPositions??={};
 if(source===target){
  delete db.boardPositions[id];
  save();
  return;
 }
 const current=items.filter(item=>item.status===source);
 if(source==='analysis'&&target==='quote'){
  for(const item of current){item.status='quote';item.returnToAnalysis=false;log(item,'Iniciou a cotação pelo Kanban.')}
  save();note(protocol(id)+' movida para Orçamento.');
  return;
 }
 db.boardPositions[id]={from:source,to:target};
 save();
 const action={
  'quote:review':'#submitBudgetReview',
  'fix:review':'#submitBudgetReview',
  'review:signature':'#batchApproval',
  'review:fix':'#batchApproval',
  'review:denied':'#batchApproval',
  'review:approved':'#batchApproval',
 }[source+':'+target];
 if(action&&(source!=='review'||admin())){
  batchDetails(id);
  $('body').querySelector(action)?.scrollIntoView({block:'nearest'});
  note('Confirme a etapa no formulário da solicitação.');
  return;
 }
 if(source==='fix'&&target==='quote'){details(current[0]);return;}
 if(source==='signature'&&target==='approved'&&admin()){
  const order=ordersFor(current).find(order=>!order.signature);
  if(order){orderDetails(order.id);return;}
 }
 if((source==='approved'&&target==='ordered')||(source==='ordered'&&target==='done')){
  details(current[0]);
  $('form')?.querySelector('input')?.focus();
  return;
 }
 note(protocol(id)+' reposicionada. Confira a etapa do fluxo no cartão.');
}
const activityLabel=activity=>esc(activity||'Não informada');
const legacyPurchaseReason=rows=>[...new Set(rows.map(r=>r.purchaseReason).filter(Boolean))].join(' · ');
const requestReason=id=>db.purchaseReasons?.[id]||legacyPurchaseReason(db.requests.filter(r=>batchId(r)===id));
const reasonLine=reason=>'<p><strong>Motivo da necessidade</strong> · '+esc(reason||'Não informado')+'</p>';
const registeredLine=name=>'<p><strong>Registrado por</strong> · '+esc(name||'Não informado')+'</p>';
const requesterLine=name=>'<p><strong>Solicitante</strong> · '+esc(name||'Não informado')+'</p>';
function batchDetails(id){
 const items=batches().find(group=>batchId(group[0])===id);
 if(!items)return;
 const pending=items.filter(r=>r.status==='analysis');
 const reviews=items.filter(r=>r.status==='review');
 open(protocol(id)+' · '+batchTitle(items),registeredLine(items[0].registeredBy)+requesterLine(items[0].requester)+reasonLine(requestReason(id))+'<p>'+esc(batchSummary(items))+'</p><div class="scroll"><table><thead><tr><th>Item e quantidade</th><th>Centro</th><th>Necessidade</th><th>Fornecedor</th><th>Etapa</th><th></th></tr></thead><tbody>'+items.map(r=>'<tr><td><strong>'+esc(r.title)+'</strong><br><small>'+esc(r.qty)+' '+esc(r.unit)+'</small></td><td>'+esc(r.center)+'</td><td>'+dateLabel(r.need)+'</td><td>'+esc(r.approval?.vendor||vendor(r.picked)?.name||vendor(r.preferred)?.name||'A definir no orçamento')+'</td><td><span class="tag">'+states[r.status]+'</span></td><td><button data-item="'+r.id+'">Abrir item</button> <button data-attach-quote="'+r.id+'">Anexar orçamento</button></td></tr>').join('')+'</tbody></table></div>'+
 (items[0].demandId?'<div class="actions"><button id="backDemand">Abrir demanda '+esc(items[0].demandId)+'</button></div>':'')+quoteComparison(items)+quoteReviewPanel(items)+quoteSubmissionPanel(items)+orderLinks(items)+inactiveButton('solicitação')+(admin()&&reviews.length?approvalPanel(items,reviews):'')+
 (pending.length?'<form id="form" class="info">'+field('Observação para cotação (opcional)','<textarea name="reason"></textarea>')+'<button class="primary" value="quote">Iniciar cotação</button></form>':''));
 document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>details(items.find(r=>r.id===Number(b.dataset.item))));
 document.querySelectorAll('[data-attach-quote]').forEach(b=>b.onclick=()=>quoteAttachmentForm(items.find(r=>r.id===Number(b.dataset.attachQuote))));
 if($('backDemand'))$('backDemand').onclick=()=>demandDetails(items[0].demandId);
 wireOrders();
 wireInactive('request',id);
 wireQuoteSubmission(id);
 document.querySelectorAll('[data-cotate-item]').forEach(b=>b.onclick=()=>{
  const item=items.find(r=>r.id===Number(b.dataset.cotateItem));
  if(item)quoteForm(item);
 });
 if(admin()&&reviews.length)wireApproval(items,reviews);
 if(pending.length)$('form').onsubmit=e=>{
  e.preventDefault();
  const status=e.submitter?.value,reason=new FormData(e.target).get('reason').trim();
  if(status!=='quote')return;
  for(const r of pending.filter(item=>item.status==='analysis')){r.status=status;r.returnToAnalysis=status==='fix';log(r,states[status]+' · '+reason)}
  save();batchDetails(id);
 };
}
const purchaseUnits=['unidade','kit','pacote','caixa','fardo','par','dúzia','rolo','folha','frasco','garrafa','saco','bandeja','kg','g','L','mL','m','m²','hora','diária'];
function unitSelect(selected=''){
 const units=selected&&!purchaseUnits.includes(selected)?[...purchaseUnits,selected]:purchaseUnits;
 return '<select name="unit" aria-label="Unidade" required><option value="">Selecione</option>'+options(units,selected)+'</select>';
}
function batchForm(draft){
 if(draft&&!visibleDrafts().includes(draft))return;
 const origin=draft?.demandId?demandById(draft.demandId):null;
 open(draft?'Completar '+protocol(draft.id):'Nova solicitação de compras','<form id="form">'+
 (origin?'<p>Demanda de origem · '+esc(origin.id+' · '+origin.title)+'</p>':'')+field('Título da solicitação','<input name="batchTitle" maxlength="120" placeholder="Ex. Materiais para o próximo evento" value="'+esc(draft?.title)+'" required>')+
 field('Registrado por · perfil em uso','<input value="'+esc(actor())+'" readonly>')+
 field('Nome de quem está solicitando','<input name="requester" maxlength="120" autocomplete="name" required>')+
 field('Motivo da necessidade','<textarea name="purchaseReason" maxlength="600" required></textarea>')+
 field('Tipo de aquisição','<select name="route" id="purchaseRoute">'+options(['Suprimentos e compras avulsas','Mercado e gêneros de consumo','Prestação de serviço com contrato'])+'</select>')+
 '<p id="purchaseRouteInfo" class="muted">O valor estimado é opcional. Registre os valores na cotação.</p>'+
 '<div class="scroll"><table class="itemTable"><thead><tr><th>Descrição do item</th><th>Qtd.</th><th>Unidade</th><th>Data necessária</th><th>Centro de serviço ou apoio</th><th>Rubrica aprovada (opcional)</th><th>Total estimado opcional (R$)</th><th>Fornecedor homologado</th><th>Observação</th><th></th></tr></thead><tbody id="itemRows"></tbody></table></div>'+
 '<div class="actions"><button type="button" id="addItem">+ Adicionar item</button><button type="submit" class="primary">Registrar solicitação</button></div><p id="batchError" role="alert"></p></form>',true);
 const rows=$('itemRows');
 let replicatedDate='';
 function add(){
  const row=rows.insertRow();
  row.innerHTML='<td><textarea name="title" aria-label="Descrição do item" required maxlength="180"></textarea></td><td><input name="qty" aria-label="Quantidade" type="number" min="1" value="1" required></td><td>'+unitSelect()+'</td><td><input name="need" aria-label="Data necessária" type="date" required><button type="button" data-replicate-date>Replicar data</button></td><td><select name="center" aria-label="Centro" required><option value="">Selecione</option>'+Object.entries(centers).map(([group,items])=>'<optgroup label="'+group+'">'+options(items)+'</optgroup>').join('')+'</select></td><td><select name="budgetId" aria-label="Rubrica aprovada (opcional)"></select></td><td><input name="estimate" aria-label="Total estimado opcional" type="number" min="0.01" step="0.01"></td><td><select name="preferred" aria-label="Fornecedor homologado"></select></td><td><textarea name="reason" aria-label="Observação"></textarea></td><td><button type="button" aria-label="Remover item">×</button></td>';
  const get=name=>row.querySelector('[name="'+name+'"]');
  const updateSupplier=()=>get('preferred').innerHTML=preferredOptions(budgetLine(get('budgetId').value)?.category,get('preferred').value);
  const updateBudget=()=>{
   get('budgetId').innerHTML=budgetOptions(get('center').value,get('need').value,get('budgetId').value);
   updateSupplier();
  };
  get('budgetId').onchange=updateSupplier;
  get('need').value=replicatedDate;
  get('center').onchange=updateBudget;get('need').onchange=updateBudget;updateBudget();

function parseVendorImport(sheet){
 const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:'',blankrows:true});
 const headers=(rows.shift()||[]).map(value=>String(value).trim());
 const positions=vendorColumns.map(([,label])=>headers.indexOf(label));
 if(positions.includes(-1))throw new Error('Use a aba Fornecedores do modelo e mantenha todos os cabeçalhos.');
 const occupied=new Set(activeVendors().map(v=>normalizeDoc(v.doc)));
 const records=[],errors=[];
 for(const [index,row] of rows.entries()){
  if(!row.some(value=>String(value).trim()))continue;
  const {categories:labels,...data}=Object.fromEntries(vendorColumns.map(([key],i)=>[key,String(row[positions[i]]??'').trim()]));
  const doc=normalizeDoc(data.doc);
  const selected=[...new Set(labels.split(';').map(value=>value.trim()).filter(Boolean))];
  let error;
  if(!data.name||!doc||!data.contact||!selected.length)error='preencha razão social, identificação, responsável e categorias.';
  else if(selected.some(category=>!categories.includes(category)))error='use as categorias listadas na aba Instruções.';
  else if(occupied.has(doc))error='a identificação já consta no cadastro ou na planilha.';
  else if(supplierFields.some(([key])=>data[key].length>180)||data.notes.length>1000)error='reduza o tamanho dos campos de texto.';
  else if(data.email&&!/^[^\s@]+@[^\s@]+$/.test(data.email))error='confira o e-mail.';
  if(error){errors.push('Linha '+(index+2)+' · '+error);continue;}
  occupied.add(doc);
  records.push({...data,reviews:[],status:Object.fromEntries(selected.map(category=>[category,'Pendente']))});
 }
 return {records,errors};
}

 };

function quoteComparison(items){
 const pending=items.filter(r=>['analysis','quote','fix','review'].includes(r.status));
 if(!pending.some(r=>r.quotes.length))return '';
 const lines=pending.map(r=>({r,quote:cheapestQuote(r)}));
 const baseline=lines.reduce((sum,{quote})=>sum+(quote?toCents(quote.price):0),0);
 const suppliers=new Set(pending.flatMap(r=>comparableQuotes(r).map(q=>q.vendor)));
 const complete=[...suppliers].map(id=>{
  const quotes=pending.map(r=>comparableQuotes(r).find(q=>q.vendor===id));
  return {id,quotes,total:quotes.reduce((sum,q)=>sum+(q?toCents(q.price):0),0)};
 }).filter(s=>s.quotes.every(Boolean)).sort((a,b)=>a.total-b.total);

function quoteReadiness(r){

 const quotes=comparableQuotes(r);
 if(new Set(quotes.map(q=>q.vendor)).size<required(r))return 'Complete '+required(r)+' cotação(ões) comparáveis.';
 if(new Set(quotes.filter(hasQuoteAttachment).map(q=>q.vendor)).size<required(r))return 'Anexe os arquivos de '+required(r)+' cotação(ões) de fornecedores distintos.';
 const chosen=quotes.find(q=>q.vendor===r.picked);
 if(!chosen||!r.choice?.trim())return 'Salve o fornecedor indicado e a justificativa.';
 if(!hasQuoteAttachment(chosen))return 'Anexe o orçamento do fornecedor indicado.';

function wireQuoteSubmission(id){

function quoteMoney(gross,discount){
 const total=toCents(gross),off=toCents(discount);
 return Number.isSafeInteger(total)&&Number.isSafeInteger(off)&&total>0&&off>=0&&off<total?total-off:null;
}

function driveFileUrl(value){
 try{
  const url=new URL(String(value||'').trim());
  if(url.protocol!=='https:'||url.username||url.password||url.port)return '';
  const id='[A-Za-z0-9_-]+';
  const drive=url.hostname==='drive.google.com'&&(new RegExp('^/file/d/'+id+'(?:/|$)').test(url.pathname)||
    (url.pathname==='/open'&&new RegExp('^'+id+'$').test(url.searchParams.get('id')||'')));
  const docs=url.hostname==='docs.google.com'&&new RegExp('^/(document|spreadsheets|presentation)/d/'+id+'(?:/|$)').test(url.pathname);
  return drive||docs?url.href:'';
 }catch{return ''}
}
const folderLink=(key,label)=>'<a href="'+esc(purchaseFolders[key])+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
function driveDocumentLink(value,label){

 return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>':'';

function driveDocumentField(key,label,value){

const portalUploadAvailable=()=>parent!==window&&typeof parent.sendKanbanQuoteToDrive==='function';
async function storeQuoteFile(file,r,uploadId){
 if(portalUploadAvailable()){
  const url=driveFileUrl(await parent.sendKanbanQuoteToDrive(window,file,r.id,uploadId));
  if(!url)throw new Error('O Drive não devolveu o link do arquivo.');
  return {name:file.name,url};
 }
 const data=await new Promise((resolve,reject)=>{
  const reader=new FileReader();reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));
  reader.readAsDataURL(file);
 });
 return {name:file.name,data};
}

function approveItems(items,reason,reopen,errorId,caveat=''){

 if(!items.length||!reason){error('Selecione pelo menos um item e registre o parecer.');return}
 for(const r of items){
  const issue=approvalIssue(r);
  if(issue){error(r.title+' · '+issue);return}
 }
 const issue=budgetCheck(items,r=>toCents(selectedQuote(r).price));
 if(issue){error(issue);return}
 const groups=new Map();
 for(const r of items){
  const id=selectedQuote(r).vendor;
  if(!groups.has(id))groups.set(id,[]);
  groups.get(id).push(r);
 }
 const orders=db.orders??=[];
 const firstId=nextId(orders);
 const previous=items.map(r=>({...r,log:[...r.log]}));
 let index=0;
 for(const [vendorId,rows] of groups){
  const id=firstId+index++;
  const supplier=vendor(vendorId).name;
  const lines=rows.map(r=>{
   const quote=selectedQuote(r);
   r.approval={...quote,vendor:supplier,reason,caveat,minimum:required(r),quoteCount:r.quotes.length,exception:r.exception};
   r.status='signature';r.orderId=id;
   log(r,'Aprovado · '+orderCode(id)+' · '+reason);
   return {id:r.id,title:r.title,qty:r.qty,unit:r.unit,center:r.center,activity:r.activity,need:r.need,budgetId:r.budgetId,cents:Math.round(quote.price*100),days:quote.days,payment:paymentLabel(quote),wholesale:quote.wholesale};
  });
  orders.unshift({id,batch:batchId(rows[0]),requester:rows[0].requester,registeredBy:rows[0].registeredBy,purchaseReason:requestReason(batchId(rows[0])),supplier,vendorId,actor:actor(),date:new Date().toLocaleDateString('pt-BR'),reason,caveat,requiresSignature:true,items:lines,total:lines.reduce((sum,line)=>sum+line.cents,0)});
 }
 try{localStorage.setItem(key,JSON.stringify(db))}catch{
  orders.splice(0,index);
  items.forEach((r,i)=>{delete r.orderId;delete r.approval;Object.assign(r,previous[i])});
  error('O navegador não conseguiu salvar a decisão. Libere espaço e tente novamente.');return;
 }
 render();reopen();note('Ordens geradas · '+orders.slice(0,index).map(o=>orderCode(o.id)).reverse().join(', ')+'.');
}

}))));
const budgetLine=id=>demoBudget.find(line=>line.id===id);
const toCents=value=>Math.round(Number(value)*100);
function budgetUse(r){
 if(r.status==='denied'||(r.inactive&&!['ordered','done'].includes(r.status)))return {reserved:0,committed:0,actual:0};
 if(!r.approval)return {reserved:toCents(r.status==='review'?(selectedQuote(r)?.price||r.estimate||0):(r.estimate||0)),committed:0,actual:0};
 const actual=realizedTotal(r);
 const remaining=Math.max(0,Number(r.qty)-realizedQty(r));
 return {reserved:0,committed:Math.round(toCents(r.approval.price)*remaining/Number(r.qty)),actual};
}
function budgetTotals(id,excluded=new Set()){
 const totals={reserved:0,committed:0,actual:0};
 for(const r of db.requests){
  if(r.budgetId!==id||excluded.has(r.id))continue;
  const use=budgetUse(r);
  for(const k of Object.keys(totals))totals[k]+=use[k];
 }
 return {...totals,available:budgetLine(id).approved-totals.reserved-totals.committed-totals.actual};
}
function budgetCheck(items,amount,optional=false){
 const excluded=new Set(items.map(r=>r.id).filter(id=>id!==undefined)),demand=new Map();
 for(const r of items){
  const line=budgetLine(r.budgetId),cents=amount(r);
  if(!Number.isSafeInteger(cents)||cents<0||(!optional&&cents===0))return r.title+' · Informe um valor total válido.';
  if(!r.budgetId)continue;
  if(!line||line.center!==r.center||String(line.year)!==r.need.slice(0,4))return r.title+' · Selecione uma rubrica aprovada do centro e exercício da data de necessidade.';
  demand.set(line.id,(demand.get(line.id)||0)+cents);
 }
 for(const [id,cents] of demand){
  const available=budgetTotals(id,excluded).available;
  if(cents>0&&cents>available)return id+' · Saldo disponível '+cash(available/100)+' para '+cash(cents/100)+' solicitados. Revise o valor ou o enquadramento orçamentário.';
 }
 return '';
}

 if(demand&&demand.decision!=='yes')return;
 open('Nova solicitação interna de compra','<p>'+esc(demand?'Demanda de origem · '+demand.id:'Compra independente')+'</p><form id="form">'+
 field('Título da compra','<input name="title" required maxlength="120" value="'+esc(demand?.title)+'">')+
 '<button class="primary">Salvar rascunho</button></form>');
 submit(f=>{
  const title=f.get('title').trim();
  if(!title||(demand&&demand.decision!=='yes'))return;
  const draft={id:nextPurchaseId(),title,owner:ownerKey(),demandId:demand?.id??null};
  db.drafts.push(draft);save();
  if(demand)demandDetails(demand.id);else draftDetails(draft);
  note(protocol(draft.id)+' criada como rascunho.');
 });
}
function draftList(){
 const drafts=visibleDrafts();
 if(!drafts.length)return '';
 return '<section><h2>Rascunhos</h2><div class="actions">'+drafts.map(p=>'<button data-draft="'+p.id+'">'+protocol(p.id)+' · '+esc(p.title)+'</button>').join('')+'</div></section>';
}
function wireDrafts(){
 document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>{
  const draft=visibleDrafts().find(p=>p.id===Number(b.dataset.draft));
  if(draft)draftDetails(draft);
 });
}
function draftDetails(draft){
 open(protocol(draft.id)+' · '+draft.title,'<p><span class="tag">Rascunho</span> · '+esc(draft.demandId||'Compra independente')+'</p>'+
 '<button id="draftItems" class="primary">Adicionar itens e rubricas</button>'+
 (draft.demandId?' <button id="draftDemand">Voltar à demanda</button>':'')+inactiveButton('solicitação'));
 wireInactive('draft',draft.id);
 $('draftItems').onclick=()=>batchForm(draft);
 if($('draftDemand'))$('draftDemand').onclick=()=>demandDetails(draft.demandId);
}


function inactiveButton(label){
 return admin()?'<button type="button" id="inactivate" style="color:#9a2424">Inativar '+label+'</button>':'';
}
function wireInactive(kind,id){
 if(admin()&&$('inactivate'))$('inactivate').onclick=()=>inactivateForm(kind,id);
}
function inactivationTargets(kind,id){
 if(kind==='draft')return db.drafts.filter(d=>d.id===id&&!d.inactive);
 const rows=db.requests.filter(r=>!r.inactive&&(kind==='order'?r.orderId===id:batchId(r)===id));
 const orders=(db.orders||[]).filter(o=>!o.inactive&&(kind==='order'?o.id===id:o.batch===id));
 return [...rows,...orders];
}
function inactivateForm(kind,id){
 if(!admin()||!inactivationTargets(kind,id).length)return;
 const order=kind==='order';
 const label=order?'ordem de compra':'solicitação';
 const reopen=()=>order?orderDetails(id):kind==='draft'?draftDetails(db.drafts.find(d=>d.id===id)):batchDetails(id);
 open('Inativar '+label+' · '+(order?orderCode(id):protocol(id)),
 '<p>'+(order?'A ordem e os itens desta ordem saem do fluxo ativo. Os demais itens da solicitação seguem normalmente.':'A solicitação e suas ordens saem do fluxo ativo.')+'</p>'+
 '<p class="muted">O histórico será preservado. Reservas e compromissos de compras ainda não realizadas são liberados. Valores de compras já realizadas permanecem no orçamento.</p>'+
 '<form id="form">'+field('Motivo da inativação','<textarea name="reason" maxlength="400" required></textarea>')+
 '<p id="inactiveError" role="alert"></p><div class="actions"><button class="primary">Confirmar inativação</button><button id="cancelInactive" type="button">Voltar</button></div></form>');
 $('cancelInactive').onclick=reopen;
 submit(f=>{
  const reason=f.get('reason').trim();
  if(!admin()||!reason)return;
  const targets=inactivationTargets(kind,id);
  if(!targets.length)return;
  const event={kind,id,reason,actor:actor(),date:new Date().toLocaleString('pt-BR')};
  for(const target of targets)target.inactive=event;
  try{localStorage.setItem(key,JSON.stringify(db))}catch{
   for(const target of targets)delete target.inactive;
   $('inactiveError').textContent='Não foi possível salvar a inativação. Tente novamente.';return;
  }
  close();tab='archive';render();note((order?orderCode(id):protocol(id))+' inativada.');
 });
}
function archivedEntries(){
 const entries=new Map();
 for(const row of [...db.drafts,...db.requests,...(db.orders||[])]){
  const event=row.inactive;
  if(!event)continue;
  const key=event.kind+':'+event.id;
  if(!entries.has(key))entries.set(key,{event,rows:[]});
  entries.get(key).rows.push(row);
 }
 return entries;
}
function renderArchive(){
 if(!admin())return;
 const entries=archivedEntries();
 $('view').innerHTML='<section><h2>Solicitações e ordens inativas</h2>'+
 ([...entries].map(([key,{event}])=>'<div class="card"><strong>'+(event.kind==='order'?orderCode(event.id):protocol(event.id))+'</strong> · '+esc(event.date)+
 '<p>'+esc(event.reason)+' · '+esc(event.actor)+'</p><button data-inactive="'+key+'">Consultar histórico</button></div>').join('')||'<p>Nenhum registro inativo.</p>')+'</section>';
 document.querySelectorAll('[data-inactive]').forEach(b=>b.onclick=()=>archiveDetails(b.dataset.inactive));
}
function archiveDetails(key){
 if(!admin())return;
 const record=archivedEntries().get(key);
 if(!record)return;
 const {event,rows}=record,items=rows.filter(r=>Array.isArray(r.log)),orders=rows.filter(r=>Array.isArray(r.items));
 open((event.kind==='order'?orderCode(event.id):protocol(event.id))+' · Inativa',
 '<p><strong>'+esc(event.reason)+'</strong> · '+esc(event.actor)+' · '+esc(event.date)+'</p>'+
 rows.filter(r=>!r.log&&!r.items).map(r=>'<p>'+esc(r.title)+'</p>').join('')+
 orders.map(o=>'<p>'+orderCode(o.id)+' · '+esc(o.supplier)+' · '+cash(o.total/100)+'</p>').join('')+
 items.map(r=>'<details><summary>'+esc(r.title)+' · '+esc(states[r.status])+'</summary><ul>'+r.log.map(entry=>'<li>'+esc(entry)+'</li>').join('')+'</ul></details>').join('')+
 '<h3>Documentos fiscais</h3>'+orderFiscal(items));
 document.querySelectorAll('[data-order-fiscal]').forEach(b=>b.onclick=()=>{
  if(!admin())return;
  const [id,index]=b.dataset.orderFiscal.split(':').map(Number);
  downloadOrderFiscal(documentsOf(items.find(r=>r.id===id))[index]);
 });
}

if(portalProfile){
 $('demoProfile').hidden=true;
 $('signedProfile').hidden=false;
 $('signedProfile').textContent=actor()+' · '+({admin:'Administrador',manager:'Gestor',collaborator:'Colaborador'}[role()]||'Colaborador');
 document.querySelector('footer').textContent='As demandas e os vínculos são do portal. Os demais registros deste quadro ficam neste navegador.';
}
render();
</script></html>
