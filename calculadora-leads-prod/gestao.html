ky;top:72px}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef6ff;color:#084fae;font-size:11px;font-weight:800}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(135deg,#071b33,#0b3a75)}.login-card{width:min(430px,100%);background:#fff;border-radius:20px;padding:28px}.login-card h2{margin:4px 0 8px}.login-card label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}.login-card input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px}.full{width:100%;margin-top:18px}.msg{color:#b42318;font-size:13px;margin-top:10px}.top-actions{display:flex;gap:8px;align-items:center}.linkbtn{text-decoration:none;display:inline-flex;align-items:center}.empty{padding:20px;color:var(--muted)}@media(max-width:700px){.shell{padding:18px}header{padding:0 16px}.top-actions span{display:none}}</style></head><body><section id="login" class="login"><div class="login-card"><div class="eyebrow">Portal Comercial</div><h2>Gestão de solicitações e propostas</h2><p class="muted">Acesso restrito à equipe autorizada.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button id="loginBtn" class="primary full">Entrar</button><div id="loginMsg" class="msg"></div></div></section><div id="app" class="hidden"><header><img src="../logo-cdl.svg"><b>Portal Comercial • Gestão</b><div class="spacer"></div><div class="top-actions"><a class="ghost linkbtn" href="index.html">Calculadora</a><span id="userLabel"></span><button id="logoutBtn" class="ghost">Sair</button></div></header><main class="shell"><div class="eyebrow">SPC Dados</div><h1>Gestão comercial</h1><p class="muted">Acompanhe solicitações recebidas e propostas geradas sem interferir na tela da calculadora.</p><div class="tabs"><button id="tabRequests" class="tab active">Solicitações</button><button id="tabProposals" class="tab">Propostas</button></div><section cl
