name: Publicar notificações no Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - supabase/functions/notificar-nova-demanda/**
      - supabase/migrations/20261027115000_notify_new_demand.sql
      - calculadora-leads-prod/supabase/functions/spc-sla-alerts/**
      - .github/workflows/deploy-supabase-edge-function.yml

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Publicar notificação de novas demandas
        run: >-
          npx --yes supabase@latest functions deploy notificar-nova-demanda
          --project-ref uswsagujxwcfvauulhzq
          --no-verify-jwt

      - name: Ativar gatilho de e-mail no banco
        shell: bash
        run: |
          jq -n \
            --rawfile query supabase/migrations/20261027115000_notify_new_demand.sql \
            '{query:$query}' > /tmp/notify-migration.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.supabase.com/v1/projects/uswsagujxwcfvauulhzq/database/query \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @/tmp/notify-migration.json

      - name: Publicar alertas de SLA do SPC
        working-directory: calculadora-leads-prod
        run: >-
          npx --yes supabase@latest functions deploy spc-sla-alerts
          --project-ref uswsagujxwcfvauulhzq
          --no-verify-jwt
